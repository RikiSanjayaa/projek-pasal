# Include inside the site's server block. Adjust root to APP_ROOT when different.
location = /mobile {
    return 301 /mobile/;
}

location ^~ /mobile/ {
    root /www/wwwroot/hukum-ubg.ac.id/projek-pasal;
    index index.html;
    try_files $uri $uri/ /mobile/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A missing precache asset must be 404, never a successful SPA document.
    location ~* \.(js|wasm|json|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|bin)$ {
        try_files $uri =404;
    }
}
