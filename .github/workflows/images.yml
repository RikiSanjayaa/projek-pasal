name: images

on:
  workflow_run:
    workflows:
      - CI - Build Verification
    branches:
      - main
    types:
      - completed
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Main builds only run after CI passed for a push to main.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            context: .
            file: backend-laravel/Dockerfile.production
          - name: admin
            context: admin-dashboard
            file: admin-dashboard/Dockerfile
          - name: mobile
            context: pasal_mobile_app
            file: pasal_mobile_app/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve build inputs
        id: inputs
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_TAG: ${{ (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caripasal-${{ matrix.name }}
          tags: |
            type=raw,value=main,enable=${{ steps.inputs.outputs.release_tag == '' && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') }}
            type=raw,value=sha-${{ steps.inputs.outputs.short_sha }}
            type=semver,pattern={{version}},value=${{ steps.inputs.outputs.release_tag }},enable=${{ steps.inputs.outputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.inputs.outputs.release_tag }},enable=${{ steps.inputs.outputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ steps.inputs.outputs.release_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            VCS_REF=${{ steps.inputs.outputs.head_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  prune:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [caripasal-app, caripasal-admin, caripasal-mobile]

    steps:
      - name: Keep the 10 newest image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
