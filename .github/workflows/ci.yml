name: CI - Build Verification

on:
  pull_request:
    branches: [main]

jobs:
  build-admin:
    name: Build Admin Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json
      
      - name: Install dependencies
        run: cd admin-dashboard && npm ci
      
      - name: Build
        run: cd admin-dashboard && npm run build

  test-backend:
    name: Test Backend Access
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caripasal_test
          POSTGRES_USER: caripasal_test
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caripasal_test -d caripasal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-laravel
    env:
      APP_KEY: base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      DB_PASSWORD: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run backend regressions
        run: vendor/bin/phpunit

  build-mobile:
    name: Build Mobile Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          # Samakan dengan ARG FLUTTER_VERSION di pasal_mobile_app/Dockerfile (material_ui butuh >= 3.47).
          flutter-version: '3.47.9'
          channel: 'stable'
      
      - name: Create env.dart
        run: |
          cd pasal_mobile_app
          cp lib/core/config/env-example.dart lib/core/config/env.dart
      
      - name: Configure web platform
        run: cd pasal_mobile_app && flutter create . --platforms web
      
      - name: Install dependencies
        run: cd pasal_mobile_app && flutter pub get

      - name: Test mobile session policy
        run: cd pasal_mobile_app && flutter test test/unit/services/auth_service_test.dart
      
      - name: Build web
        run: cd pasal_mobile_app && flutter build web --release
