<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CariPasal Mobile">

  <!-- Status bar Android. Satu meta tanpa `media` disengaja: Firefox Android
       memakai meta pertama yang ditemukan, dan media query membuat warnanya
       mengikuti OS, bukan tema app. Nilai awal dipilih dari preferensi OS;
       setelah Flutter jalan, theme_color_sync.dart memperbaruinya mengikuti
       tema app (mode Sistem/Terang/Gelap). Manifest sengaja tidak memuat
       `theme_color` karena Firefox memprioritaskannya di atas meta. -->
  <meta name="theme-color" content="#F5F7FA">
  <script>
    (function () {
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches) {
        meta.setAttribute('content', '#121212');
      }
    })();
  </script>
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CariPasal">
  <link rel="apple-touch-icon" href="icons/apple-touch-light-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-light.png"/>

  <title>CariPasal Mobile</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Cegah kilatan putih sebelum Flutter menggambar. */
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F5F7FA;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #121212;
      }
    }
  </style>
</head>
<body>
  <script src="offline.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
