name: caripasal

x-app: &app
  image: ${CARIPASAL_APP_IMAGE:?set CARIPASAL_APP_IMAGE}
  pull_policy: ${CARIPASAL_PULL_POLICY:-always}
  env_file: app.env
  environment:
    RUN_MIGRATIONS: 'false'
    RUN_SEEDERS: 'false'
  volumes:
    - storage:/var/www/html/storage
    - ./deploy/php/production.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:18-alpine
    env_file: bootstrap.env
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  init:
    <<: *app
    command: [php, artisan, migrate, --force]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  imports:
    <<: *app
    restart: unless-stopped
    command: [php, artisan, 'queue:work', '--queue=imports', '--sleep=3', '--tries=1', '--timeout=900']
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8000/up']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  admin:
    image: ${CARIPASAL_ADMIN_IMAGE:?set CARIPASAL_ADMIN_IMAGE}
    pull_policy: ${CARIPASAL_PULL_POLICY:-always}
    restart: unless-stopped
    ports:
      - '${ADMIN_BIND:-0.0.0.0}:8081:80'
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  mobile:
    image: ${CARIPASAL_MOBILE_IMAGE:?set CARIPASAL_MOBILE_IMAGE}
    pull_policy: ${CARIPASAL_PULL_POLICY:-always}
    restart: unless-stopped
    ports:
      - '${MOBILE_BIND:-0.0.0.0}:8082:80'
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

volumes:
  database:
  storage:
