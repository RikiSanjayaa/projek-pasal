<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CariPasal Mobile">

  <!-- Warna chrome browser/status bar Android. Nilai media query dipakai
       sebelum Flutter berjalan; setelah itu theme_color_sync.dart memperbarui
       semua tag ini mengikuti tema aplikasi (terang/gelap). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F7FA">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
  <meta name="theme-color" content="#F5F7FA">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CariPasal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CariPasal Mobile</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Cegah kilatan putih sebelum Flutter menggambar. */
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F5F7FA;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #121212;
      }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js?v=15f8f1c-1794144531" async></script>
</body>
</html>
